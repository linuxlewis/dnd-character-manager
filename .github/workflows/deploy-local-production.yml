name: Deploy Local Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnd-character-manager-local-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, dev-server-1, dnd-character-manager, production]
    environment: local-production
    timeout-minutes: 20

    steps:
      - name: Resolve deployment revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            deploy_sha="${{ github.event.workflow_run.head_sha }}"
          else
            deploy_sha="${{ github.sha }}"
          fi

          if [ -z "$deploy_sha" ]; then
            echo "::error::Could not resolve deployment revision."
            exit 1
          fi

          printf 'sha=%s\n' "$deploy_sha" >> "$GITHUB_OUTPUT"

      - name: Deploy exact revision through host Docker
        shell: bash
        env:
          GH_FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deploy_sha="${{ steps.revision.outputs.sha }}"
          workspace="/home/sbolgert/workspace/dnd-character-manager"
          compose=(docker compose --env-file .env.production -f docker-compose.prod.yml)

          cd "$workspace"

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Production workspace has uncommitted changes; refusing to deploy."
            git status --short
            exit 1
          fi

          git fetch "https://x-access-token:${GH_FETCH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "+refs/heads/*:refs/remotes/origin/*"
          git checkout --detach "$deploy_sha"

          "${compose[@]}" up -d --build

          for _ in {1..12}; do
            if "${compose[@]}" exec -T app node -e "fetch('http://127.0.0.1:4000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              break
            fi

            sleep 5
          done

          "${compose[@]}" exec -T app node -e "fetch('http://127.0.0.1:4000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          "${compose[@]}" exec -T app node -e "fetch('http://127.0.0.1:4000/openapi.json').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          curl --fail --retry 6 --retry-delay 5 -I https://characters.dndinventorymanager.com

          require_revalidated_cache() {
            local path="$1"
            local headers
            local cache_control
            local normalized

            headers="$(curl --fail --retry 6 --retry-delay 5 --silent --show-error --head "https://characters.dndinventorymanager.com${path}")"
            cache_control="$(
              printf '%s\n' "$headers" | awk '
                tolower($0) ~ /^cache-control:/ {
                  value = $0
                  sub(/^[^:]+:[[:space:]]*/, "", value)
                  gsub(/\r$/, "", value)
                  cache = cache ? cache ", " value : value
                }
                END { print cache }
              '
            )"
            normalized="${cache_control,,}"

            if [ -z "$normalized" ]; then
              echo "::error::${path} did not include a Cache-Control header."
              printf '%s\n' "$headers"
              exit 1
            fi

            if [[ "$normalized" != *"no-cache"* || "$normalized" != *"must-revalidate"* ]]; then
              echo "::error::${path} must be served with no-cache, must-revalidate; got '${cache_control}'."
              exit 1
            fi

            if [[ "$normalized" == *"public"* || "$normalized" =~ max-age=[1-9] ]]; then
              echo "::error::${path} is still publicly cacheable; got '${cache_control}'."
              exit 1
            fi
          }

          require_revalidated_cache "/"
          require_revalidated_cache "/manifest.webmanifest"
          require_revalidated_cache "/registerSW.js"
          require_revalidated_cache "/sw.js"
